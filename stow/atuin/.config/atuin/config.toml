# ==============================================================================
# config.toml — Atuin Shell History Configuration
# ==============================================================================
# Atuin replaces the default shell history (Ctrl-R) with a searchable,
# syncable, SQLite-backed history database.
#
# LOCATION: ~/.config/atuin/config.toml (symlinked by install.sh)
# DOCS:     https://docs.atuin.sh
#
# USAGE:
#   atuin search <query>      # Search history from the command line
#   Ctrl-R                    # Interactive fuzzy search (replaces default)
#   Up arrow                  # Filtered history recall (host-scoped)
#   atuin stats               # Show command usage statistics
#   atuin sync                # Manually trigger sync (if server configured)
# ==============================================================================

# --- Search Behavior ----------------------------------------------------------

# How Atuin matches your search query against history entries.
# Options: "prefix" (starts-with), "fulltext" (substring), "fuzzy" (typo-tolerant), "skim" (fzf-like)
# "fuzzy" is the most forgiving — it matches even with typos or partial input.
search_mode = "fuzzy"

# Which history pool to search by default in the interactive UI.
# Options: "global" (all machines), "host" (this machine only), "session" (this terminal), "directory" (cwd only)
# "global" lets you recall commands run on other synced machines.
filter_mode = "global"

# When pressing Up arrow in the shell, only show commands from this host.
# This prevents confusion — Up arrow feels "local" while Ctrl-R searches everywhere.
filter_mode_shell_up_key_binding = "host"

# --- UI Appearance ------------------------------------------------------------

# Controls how much chrome the search UI shows.
# Options: "auto", "full" (with borders/headers), "compact" (minimal, more visible history)
# "compact" maximizes screen real estate for history results.
style = "compact"

# When true, pressing Enter in the search UI immediately executes the selected command.
# When false, it pastes the command into your prompt for editing before execution.
enter_accept = true

# Hide the help bar at the bottom of the search UI to reduce visual noise.
show_help = false

# Show filter mode tabs (global/host/session/directory) at the top of the search UI.
show_tabs = true

# --- History Filtering --------------------------------------------------------
# Regex patterns to EXCLUDE from history recording entirely.
# Matching commands are never stored — useful for preventing secrets from leaking
# into the history database (especially important if syncing to a remote server).
history_filter = [
  "^secret-",               # Any command starting with "secret-"
  "^export .*TOKEN",        # Environment variable exports containing tokens
  "^export .*KEY",          # Environment variable exports containing keys
  "^export .*PASSWORD",     # Environment variable exports containing passwords
]

# --- Statistics ---------------------------------------------------------------
# Configure how `atuin stats` groups and displays command usage.
[stats]
# Commands with subcommands — Atuin groups "git commit" and "git push" separately
# instead of counting all "git" invocations as one entry.
common_subcommands = [
  "cargo",
  "docker",
  "git",
  "go",
  "kubectl",
  "npm",
  "systemctl",
  "tmux",
]
# Strip these prefixes before grouping — "sudo apt install" counts as "apt install".
common_prefix = ["sudo"]

# --- Key Bindings -------------------------------------------------------------
[keys]
# When true, scrolling past the end of search results exits the search UI.
# Provides a quick way to dismiss search without pressing Escape.
scroll_exits = true

# --- Sync Configuration ------------------------------------------------------
# Atuin can sync history across machines via an encrypted remote server.
# Requires: `atuin register` or `atuin login` to set up an account.
[sync]
# Use the newer record-based sync protocol (more reliable, supports deletions).
records = true

