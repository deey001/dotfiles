# Alacritty configuration for riced terminal
# See https://alacritty.org/config-alacritty.html for full options

# Window settings
window:
  opacity: 0.95
  padding:
    x: 10
    y: 10
  decorations: none  # Borderless for ricing

# Font settings (uses installed Nerd Font)
font:
  normal:
    family: "JetBrainsMono Nerd Font"
    style: Regular
  bold:
    family: "JetBrainsMono Nerd Font"
    style: Bold
  italic:
    family: "JetBrainsMono Nerd Font"
    style: Italic
  bold_italic:
    family: "JetBrainsMono Nerd Font"
    style: Bold Italic
  size: 14.0

# Catppuccin Mocha
colors:
  primary:
    background: '0x1e1e2e'
    foreground: '0xcdd6f4'
  cursor:
    text: '0x1e1e2e'
    cursor: '0xf5e0dc'
  normal:
    black:   '0x45475a'
    red:     '0xf38ba8'
    green:   '0xa6e3a1'
    yellow:  '0xf9e2af'
    blue:    '0x89b4fa'
    magenta: '0xf5c2e7'
    cyan:    '0x94e2d5'
    white:   '0xbac2de'
  bright:
    black:   '0x585b70'
    red:     '0xf38ba8'
    green:   '0xa6e3a1'
    yellow:  '0xf9e2af'
    blue:    '0x89b4fa'
    magenta: '0xf5c2e7'
    cyan:    '0x94e2d5'
    white:   '0xa6adc8'

# Key bindings (optional ricing shortcuts)
key_bindings:
  - { key: N, mods: Control|Shift, action: SpawnNewInstance }
  - { key: Q, mods: Control|Shift, action: Quit }

# Performance
scrolling:
  history: 10000

# Shell (Defaults to system shell for portability)
# shell:
#   program: /bin/bash
#   args:
#     - --login