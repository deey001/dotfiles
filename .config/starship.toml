# Starship Prompt — Pure-inspired minimal style with Catppuccin Mocha colors
# Two-line: info on top, prompt char below

format = """\
$os\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$golang\
$rust\
$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 5000

[character]
success_symbol = "[❯](mauve)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[os]
disabled = false
style = "fg:#cdd6f4"
format = '[$symbol]($style)'

[os.symbols]
Windows = " "
Ubuntu = " "
Debian = " "
Raspbian = " "
Mint = "󰹮 "
Macos = " "
Manjaro = " "
Linux = " "
Gentoo = "󰹩 "
Fedora = " "
Alpine = " "
Amazon = " "
Android = " "
Arch = " "
Artix = " "
CentOS = " "
NixOS = " "
Redhat = "󱄛 "
SUSE = " "

[username]
show_always = false
style_user = "fg:#cdd6f4"
style_root = "fg:#f38ba8 bold"
format = '[$user]($style)'

[hostname]
ssh_only = true
style = "fg:#a6adc8"
format = '[@$hostname]($style) '

[directory]
style = "fg:#89b4fa bold"
format = '[$path]($style) '
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = " "
style = "fg:#a6adc8"
format = '[$symbol$branch]($style) '

[git_status]
style = "fg:#f9e2af"
format = '[$all_status$ahead_behind]($style)'

[cmd_duration]
min_time = 2_000
style = "fg:#f9e2af"
format = '[$duration]($style) '

[python]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol($virtualenv )]($style)'

[nodejs]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol$version]($style) '

[golang]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol$version]($style) '

[rust]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol$version]($style) '

[java]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol$version]($style) '

[docker_context]
symbol = " "
style = "fg:#89b4fa"
format = '[$symbol$context]($style) '

[time]
disabled = true
