# Starship configuration - Cross-terminal compatible version
# Optimized for Terminal.app, iTerm2, and Alacritty

format = """
[](fg:238)\
$os\
$username\
$hostname\
[](fg:238 bg:240)\
$directory\
[](fg:240 bg:235)\
$git_branch\
$git_status\
[](fg:235 bg:33)\
$c\
$nodejs\
$rust\
$docker_context\
[](fg:33 bg:237)\
$time\
[ ](fg:237)\
"""

command_timeout = 5000

[username]
show_always = true
style_user = "bg:238 fg:250"
style_root = "bg:238 fg:160"
format = '[$user]($style)'

[hostname]
ssh_only = false
style = "bg:238 fg:250"
format = '[@$hostname ]($style)'

[os]
disabled = false
style = "bg:238 fg:255"
format = '[$symbol]($style)'

[os.symbols]
Windows = "󰍲 "
Ubuntu = " "
Debian = " "
Macos = " "
Arch = " "
Linux = " "

[directory]
style = "bg:240 fg:255"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:235 fg:255"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:235 fg:255"
format = '[$all_status$ahead_behind ]($style)'

[c]
symbol = " "
style = "bg:33 fg:255"
format = '[ $symbol ]($style)'

[nodejs]
symbol = " "
style = "bg:33 fg:255"
format = '[ $symbol ]($style)'

[rust]
symbol = " "
style = "bg:33 fg:255"
format = '[ $symbol ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:237 fg:255"
format = '[ $time ]($style)'
