# ==============================================================================
# .tmux.conf - Tmux Configuration File
# ==============================================================================
# This configuration enhances Tmux with better keybindings, valid mouse support,
# system clipboard integration (OSC 52), and a custom status bar.
#
# WHEN LOADED:
#   - By tmux on startup (reads ~/.tmux.conf or $XDG_CONFIG_HOME/tmux/tmux.conf)
#   - On demand via: Prefix + r (reload binding defined below)
#
# DEPENDENCIES:
#   - Tmux 3.2+ (for allow-passthrough, OSC 52 support)
#   - TPM (Tmux Plugin Manager): git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   - Nerd Font (for icons in status bar — e.g., Powerline glyphs, Nerd Font icons)
#   - ~/.config/tmux/scripts/ (yank.sh, get_network_status.sh)
#
# PREFIX KEY: Ctrl+a (changed from default Ctrl+b)
#
# COMMON WORKFLOWS:
#   Prefix + \  or  Prefix + v  → split pane vertically (side by side)
#   Prefix + -  or  Prefix + s  → split pane horizontally (stacked)
#   Prefix + h/j/k/l            → navigate panes (Vim-style)
#   Prefix + o                  → open tmux-sessionx (fuzzy session switcher)
#   Prefix + p                  → open tmux-floax (floating terminal pane)
#   Prefix + r                  → reload this config file
#   Prefix + S                  → toggle synchronized panes (type in all at once)
#   Prefix + m / M              → toggle mouse on / off
#   Prefix + I                  → install TPM plugins (after adding new ones)
#   Prefix + [                  → enter copy mode (vi keys: v=select, y=yank)
# ==============================================================================

# ------------------------------------------------------------------------------
# Core Settings
# ------------------------------------------------------------------------------

# Change Prefix from Ctrl-b to Ctrl-a (matches GNU Screen convention)
# Ctrl-a is easier to reach on most keyboards than Ctrl-b
# Alternative: some users prefer Ctrl-Space (bind C-Space send-prefix)
unbind C-b
set -g prefix C-a
# Allow sending literal Ctrl-a to programs (press Ctrl-a twice)
bind C-a send-prefix

# Enable True Color (24-bit RGB) support for Neovim, bat, delta, etc.
# Each terminal-overrides line adds Tc (True Color) capability for matching $TERM values
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm*:Tc:RGB"
set -ga terminal-overrides ",*256col*:Tc:RGB"
set -ga terminal-overrides ",tmux-256color:Tc:RGB"
set -ga terminal-overrides ",alacritty:Tc:RGB"
# Force the Ms capability so OSC 52 clipboard sequences pass through to the
# terminal emulator — essential for remote clipboard over SSH
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Generous scrollback — 1M lines so you rarely lose output
set -g history-limit 1000000

# Reduce Escape key delay to 10ms (default 500ms) — prevents lag when
# pressing Esc in Vim/Neovim inside tmux
set -sg escape-time 10

# Use the user's default shell without forcing login shell behavior
set -g default-command "${SHELL}"

# Number windows and panes starting at 1 (not 0) — matches keyboard layout
# where 1 is the leftmost number key
set -g base-index 1
setw -g pane-base-index 1

# Automatically renumber windows when one is closed to avoid gaps
# e.g., closing window 2 of [1,2,3] gives [1,2] not [1,3]
set -g renumber-windows on

# ------------------------------------------------------------------------------
# Mouse Support
# ------------------------------------------------------------------------------
# Enable mouse support for selecting panes, resizing, and scrolling
set -g mouse on

# Toggle mouse on/off with 'm' and 'M'
unbind m
bind m \
    set -g mouse on \;\
    display 'Mouse: ON'
unbind M
bind M \
    set -g mouse off \;\
    display 'Mouse: OFF'

# ------------------------------------------------------------------------------
# Navigation & Pane Management
# ------------------------------------------------------------------------------

# Split panes with memorable keys — | and - mirror the visual split direction
# -c "#{pane_current_path}" opens the new pane in the same working directory
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Vim-style alternatives: v for vertical (side-by-side), s for horizontal (stacked)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# Remove default split bindings to avoid confusion
unbind '"'
unbind %

# Vim-style pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Switch panes with Alt-Arrow keys — no Prefix needed for quick navigation
# Note: may conflict with some terminal emulators' own Alt+Arrow bindings
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Prefix + Shift-Arrow keys (5 cells at a time)
# -r flag allows repeating without pressing Prefix again
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5

# Large resize jumps (20 cells) with Prefix + H/L
bind -r -T prefix H resize-pane -L 20
bind -r -T prefix L resize-pane -R 20

# Reload config file easily
bind r source-file ~/.config/tmux/tmux.conf \; display "Config Reloaded!"

# Rename current window
bind , command-prompt -I "#W" "rename-window '%%'"

# Synchronize panes (type in all panes at once)
# USAGE: Press Prefix + S to enable, Prefix + S again to disable
# Useful for running commands on multiple servers simultaneously
bind S set-window-option synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# ------------------------------------------------------------------------------
# Status Bar
# ------------------------------------------------------------------------------
# Position the status bar at the top of the terminal (bottom is default)
set -g status-position top
# Refresh status bar every 60 seconds — balances freshness with performance
# (the network status script has its own 5-min cache)
set -g status-interval 60

# Pane border colors (Catppuccin Mocha palette)
# Active pane gets magenta border; inactive panes get dim gray
set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# ------------------------------------------------------------------------------
# Plugins (TPM - Tmux Plugin Manager)
# ------------------------------------------------------------------------------
# Install plugins: Prefix + I    Update plugins: Prefix + U
# Uninstall removed plugins: Prefix + Alt+u
# Plugin source: https://github.com/tmux-plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'            # Sensible defaults everyone agrees on
set -g @plugin 'tmux-plugins/tmux-resurrect'            # Save/restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-continuum'            # Auto-save sessions every 15 minutes
set -g @plugin 'fcsonline/tmux-thumbs'                  # Quick text copy (like tmux-fingers but Rust)
set -g @plugin 'sainnhe/tmux-fzf'                       # Fuzzy finder for tmux entities
set -g @plugin 'wfxr/tmux-fzf-url'                     # Extract/open URLs from pane output
set -g @plugin 'catppuccin/tmux'                        # Catppuccin Mocha theme
set -g @plugin 'omerxx/tmux-sessionx'                   # Fuzzy session switcher (Prefix + o)
set -g @plugin 'omerxx/tmux-floax'                      # Floating terminal pane (Prefix + p)
set -g @plugin '0xAF/tmux-public-ip'                  # WAN IP and ISP info

# --- Plugin Configuration -----------------------------------------------------
set -g @public_ip_refresh_seconds '300'               # Refresh every 5 minutes (matches old script)

# Suggested plugins (uncomment to enable):
# set -g @plugin 'tmux-plugins/tmux-open'              # Open highlighted file/URL: o=open, Ctrl+o=editor
# set -g @plugin 'tmux-plugins/tmux-copycat'           # Regex search in scrollback: Prefix + /
# set -g @plugin 'tmux-plugins/tmux-logging'           # Log pane output to file: Prefix + Shift+p
# set -g @plugin 'tmux-plugins/tmux-pain-control'      # Standardized pane navigation keybindings
# set -g @plugin 'jaclu/tmux-menus'                    # Context menus for common tmux operations

# Session persistence — tmux-continuum auto-restores the last saved session
set -g @continuum-restore 'on'
# tmux-resurrect saves/restores Neovim sessions (requires Session.vim support)
set -g @resurrect-strategy-nvim 'session'

# ------------------------------------------------------------------------------
# Catppuccin Theme (v2 API)
# ------------------------------------------------------------------------------
# Theme: Catppuccin Mocha — dark theme with pastel accents
# Full palette: https://github.com/catppuccin/catppuccin#-palette
set -g @catppuccin_flavor "mocha"
# Transparent status bar background (inherits terminal background)
set -g @catppuccin_status_background "default"

# Window tabs styled as rounded pills using Powerline glyphs
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
# Show zoom indicator (󰁌) when a pane is zoomed (Prefix + z)
set -g @catppuccin_window_current_text " #W#{?window_zoomed_flag, 󰁌,}"
set -g @catppuccin_window_flags "none"
set -g @catppuccin_window_number_position "left"

# Date/time module
set -g @catppuccin_date_time_text " %m/%d %H:%M"

# Directory module
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# Status lengths (set before TPM so plugins can use them)
set -g status-left-length 100
set -g status-right-length 200

# ------------------------------------------------------------------------------
# Plugin Settings
# ------------------------------------------------------------------------------

# tmux-sessionx — fuzzy session switcher (Prefix + o)
# Uses fzf to search/create/switch sessions; integrates with zoxide
set -g @sessionx-bind 'o'
set -g @sessionx-auto-accept 'off'
# Enable zoxide integration so frequently-visited directories appear in results
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-filter-current 'false'

# tmux-floax — floating terminal pane (Prefix + p)
# Opens a centered floating pane; press Prefix + p again to toggle
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
# Inherit the current pane's working directory in the floating pane
set -g @floax-change-path 'true'

# tmux-fzf-url — extract and open URLs from pane content (Prefix + u)
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Initialize TMUX plugin manager (must run before hand-crafted status lines)
# TPM clones plugins to ~/.tmux/plugins/ and sources them here
run '~/.tmux/plugins/tpm/tpm'

# ==============================================================================
# Hand-Crafted Status Bar (MUST be after 'run tpm')
# ==============================================================================
# These lines override Catppuccin's default status layout with custom pills.
# They MUST come after TPM initialization so the theme doesn't overwrite them.
# Icons use Nerd Font Powerline chars:  (U+E0B6 left round)  (U+E0B4 right round)

# Ensure the main status bar background is transparent
set -g status-style bg=default

# Left: Session pill (green, turns red on prefix)
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=default]#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#a6e3a1}]  #S#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=default] "

# Right: Directory + Date/Time + Hostname pills
set -g status-right "#[fg=#f5e0dc,bg=default]#[fg=#11111b,bg=#f5e0dc]  #{b:pane_current_path}#[fg=#f5e0dc,bg=default]#[bg=default]"
set -ga status-right " #[fg=#74c7ec,bg=default]#[fg=#11111b,bg=#74c7ec] 󰃰 %m/%d %I:%M %p#[fg=#74c7ec,bg=default]#[bg=default]"
set -ga status-right " #[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa] 󰌘 #(hostname -I | awk '{print $1}')  #(bash ~/.config/tmux/scripts/wan_info.sh isp):#(bash ~/.config/tmux/scripts/wan_info.sh ip)#[fg=#89b4fa,bg=default]#[bg=default]"

# ------------------------------------------------------------------------------
# Clipboard (AFTER TPM — explicit OSC 52 via yank.sh)
# ------------------------------------------------------------------------------
# Clipboard integration uses ~/.config/tmux/scripts/yank.sh which tries
# native tools first (pbcopy → xclip → xsel → wl-copy) then falls back
# to OSC 52 escape sequences. This works on macOS, Linux desktop, AND
# headless Linux over SSH (if the terminal supports OSC 52).

# Tell tmux to use the terminal's clipboard via OSC 52
set -s set-clipboard on
# Allow programs inside tmux to send escape sequences through to the terminal
# (required for OSC 52 clipboard passthrough)
set -g allow-passthrough on

# Use vi-style keys in copy mode (enter with Prefix + [)
setw -g mode-keys vi
# v = begin selection (like Vim visual mode)
bind -T copy-mode-vi v send -X begin-selection
# y = yank (copy) selection and exit copy mode, piping text through yank.sh
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank.sh"
# Enter also yanks (alternative to y)
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank.sh"
# Mouse drag selection auto-yanks when mouse button is released
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/yank.sh"
