# Based on Omarchy's tmux.conf, with the Catppuccin status bar. No plugins.

# Prefix (C-a kept as a second prefix for muscle memory)
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix

bind q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind ? list-keys -N

# Clipboard: anything copied in tmux (y, Enter, mouse drag) or by a program
# inside it (nvim, `clip`) goes to the local machine's clipboard via OSC 52,
# including over SSH. Paste with the terminal's own paste key or prefix + ].
set -g set-clipboard on
set -sq terminal-features ",*:clipboard"
set -as terminal-overrides ",*:Ms=\\E]52;%p1%s;%p2%s\\007" # tmux < 3.2
set -gq allow-passthrough on
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel
bind ] paste-buffer -p

# Panes
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -n M-Escape kill-pane
bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind x kill-pane

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n C-M-Left select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up select-pane -U
bind -n C-M-Down select-pane -D
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5
bind S set-window-option synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# Windows
bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-Left select-window -t -1
bind -n M-Right select-window -t +1
bind -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Sessions
bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
setw -g aggressive-resize on
set -g detach-on-destroy off

# Status bar (Catppuccin Mocha pills with Nerd Font icons)
set -g status-position top
set -g status-interval 60
set -g status-left-length 100
set -g status-right-length 200
set -g window-status-separator " "
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

set -g status-style "bg=default,fg=#cdd6f4"
# Session (turns red while the prefix is pressed)
set -g status-left "#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=default]#[fg=#11111b,bg=#{?client_prefix,#f38ba8,#a6e3a1}]  #S#[fg=#{?client_prefix,#f38ba8,#a6e3a1},bg=default] "
# Current directory, date/time, then LAN IP and ISP:WAN IP (cached 5 min by wan_info.sh)
set -g status-right "#[fg=#f5e0dc,bg=default]#[fg=#11111b,bg=#f5e0dc]  #{b:pane_current_path}#[fg=#f5e0dc,bg=default]#[bg=default]"
set -ga status-right " #[fg=#74c7ec,bg=default]#[fg=#11111b,bg=#74c7ec] 󰃰 %m/%d %I:%M %p#[fg=#74c7ec,bg=default]#[bg=default]"
set -ga status-right " #[fg=#89b4fa,bg=default]#[fg=#11111b,bg=#89b4fa] 󰌘 #(hostname -I | awk '{print $1}')  #(bash ~/.config/tmux/scripts/wan_info.sh isp):#(bash ~/.config/tmux/scripts/wan_info.sh ip)#[fg=#89b4fa,bg=default]#[bg=default]"
# Windows: number + name, rounded; zoom icon on the current window when zoomed
set -g window-status-format "#[fg=#9399b2,bg=default]#[fg=#11111b,bg=#9399b2]#I #[fg=#cdd6f4,bg=#313244] #W#[fg=#313244,bg=default]"
set -g window-status-current-format "#[fg=#cba6f7,bg=default]#[fg=#11111b,bg=#cba6f7]#I #[fg=#cdd6f4,bg=#45475a] #W#{?window_zoomed_flag, 󰁌,}#[fg=#45475a,bg=default]"
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g message-style "bg=default,fg=#cba6f7"
set -g message-command-style "bg=default,fg=#cba6f7"
set -g mode-style "bg=#45475a,fg=#cdd6f4"
setw -g clock-mode-colour "#cba6f7"

# Machine-specific overrides
if-shell "[ -f ~/.config/tmux/local.conf ]" "source-file ~/.config/tmux/local.conf"
