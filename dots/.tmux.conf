# ==============================================================================
# .tmux.conf - Tmux Configuration File
# ==============================================================================
# This configuration enhances Tmux with better keybindings, valid mouse support,
# system clipboard integration (OSC 52), and a custom status bar.
# ==============================================================================

# ------------------------------------------------------------------------------
# Core Settings
# ------------------------------------------------------------------------------

# Change Prefix from Ctrl-b to Ctrl-a (Like GNU Screen)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable True Color support
# Enable True Color support and OSC 52 clipboard support (Ms capability)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",*256col*:Tc"
# Force Ms capability for OSC 52 clipboard to work in PuTTY/Alacritty/etc
set -as terminal-overrides ',*:Ms=\E]52;%p1%s;%p2%s\007'

# Increase scrollback history
set -g history-limit 50000

# Fix potential delay when pressing Esc (for Vim)
set -sg escape-time 10

# Use login shell to ensure .bash_profile and .bashrc are sourced
set -g default-command "${SHELL}"

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically when one is closed
set -g renumber-windows on

# ------------------------------------------------------------------------------
# Mouse Support
# ------------------------------------------------------------------------------
# Enable mouse support for selecting panes, resizing, and scrolling
set -g mouse on

# Toggle mouse on/off with 'm' and 'M'
unbind m
bind m \
    set -g mouse on \;\
    display 'Mouse: ON'
unbind M
bind M \
    set -g mouse off \;\
    display 'Mouse: OFF'

# ------------------------------------------------------------------------------
# Clipboard Integration (OSC 52 with xclip fallback)
# ------------------------------------------------------------------------------
# IMPORTANT: OSC 52 doesn't work reliably in PuTTY.
# For PuTTY users: Use mouse selection (automatically copies to clipboard)
# or install X11 forwarding and use xclip.
set -s set-clipboard on

# Use Vi mode for copy mode
setw -g mode-keys vi

# Bind 'v' to begin selection (like Vim)
bind -T copy-mode-vi v send -X begin-selection

# Bind 'y' to copy - tries pbcopy (macOS), xclip (Linux), then OSC 52
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "\
    tee /tmp/tmux-buffer | \
    if command -v pbcopy >/dev/null 2>&1; then \
        pbcopy; \
    elif command -v xclip >/dev/null 2>&1; then \
        xclip -selection clipboard; \
    elif command -v xsel >/dev/null 2>&1; then \
        xsel --clipboard --input; \
    else \
        cat > /dev/null; \
    fi"

# Alternative: 'Y' copies and displays the text (useful for debugging)
bind -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel "\
    tee /tmp/tmux-buffer && \
    echo '=== COPIED TO TMUX BUFFER ===' && \
    cat /tmp/tmux-buffer && \
    echo '' && \
    echo '=== Paste with: Prefix + ] or cat /tmp/tmux-buffer ==='"

# Update default binding of `Enter` to also copy
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "\
    tee /tmp/tmux-buffer | \
    if command -v pbcopy >/dev/null 2>&1; then \
        pbcopy; \
    elif command -v xclip >/dev/null 2>&1; then \
        xclip -selection clipboard; \
    elif command -v xsel >/dev/null 2>&1; then \
        xsel --clipboard --input; \
    else \
        cat > /dev/null; \
    fi"

# Mouse drag copy behavior
unbind -T copy-mode-vi MouseDragEnd1Pane
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "\
    tee /tmp/tmux-buffer | \
    if command -v pbcopy >/dev/null 2>&1; then \
        pbcopy; \
    elif command -v xclip >/dev/null 2>&1; then \
        xclip -selection clipboard; \
    elif command -v xsel >/dev/null 2>&1; then \
        xsel --clipboard --input; \
    else \
        cat > /dev/null; \
    fi"

# ------------------------------------------------------------------------------
# Navigation & Pane Management
# ------------------------------------------------------------------------------

# Split panes using | and - (or s and v like Vim)
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane navigation (Prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Switch panes with Alt-Arrow keys without Prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Prefix + Shift-Arrow keys
bind -r S-Up resize-pane -U 5
bind -r S-Down resize-pane -D 5
bind -r S-Left resize-pane -L 5
bind -r S-Right resize-pane -R 5

# Resize panes with Prefix + , . - = (like Omer's config)
bind -r -T prefix , resize-pane -L 20
bind -r -T prefix . resize-pane -R 20

# Reload config file easily
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Synchronize panes (type in all panes at once)
# USAGE: Press Prefix + S to enable, Prefix + S again to disable
# Useful for running commands on multiple servers simultaneously
bind S set-window-option synchronize-panes \; display "Sync: #{?synchronize-panes,ON,OFF}"

# ------------------------------------------------------------------------------
# Status Bar Theme (Catppuccin Mocha)
# ------------------------------------------------------------------------------

# Catppuccin Mocha palette
set -g @ctp_base "#1e1e2e"
set -g @ctp_mantle "#181825"
set -g @ctp_surface0 "#313244"
set -g @ctp_surface1 "#45475a"
set -g @ctp_surface2 "#585b70"
set -g @ctp_overlay0 "#6c7086"
set -g @ctp_text "#cdd6f4"
set -g @ctp_blue "#89b4fa"
set -g @ctp_green "#a6e3a1"
set -g @ctp_yellow "#f9e2af"
set -g @ctp_peach "#fab387"
set -g @ctp_red "#f38ba8"
set -g @ctp_mauve "#cba6f7"
set -g @ctp_lavender "#b4befe"
set -g @ctp_teal "#94e2d5"

# Status bar colors
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Active Window
set-window-option -g window-status-current-style "fg=#1e1e2e,bg=#89b4fa,bold"
set-window-option -g window-status-current-format " #I: #W "
set-window-option -g window-status-style "fg=#cdd6f4,bg=#313244"
set-window-option -g window-status-format " #I: #W "

# Pane Borders
set-option -g pane-border-style "fg=#313244"
set-option -g pane-active-border-style "fg=#89b4fa"

# Message style
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cdd6f4"

# Alignment
set -g status-justify centre
set -g status-interval 60

# Left Side Status: Network Info
set -g status-left-length 150
set -g status-left "#(bash ~/.config/tmux/scripts/get_network_status.sh)"

# Right Side Status: Session and Time
set -g status-right-length 80
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e] #S #I:#P #[fg=#f9e2af]:: %m/%d/%Y #[fg=#a6e3a1]:: %l:%M %p ::"

# ------------------------------------------------------------------------------
# Plugins (TPM)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'           # Better clipboard
set -g @plugin 'tmux-plugins/tmux-resurrect'       # Save sessions
set -g @plugin 'tmux-plugins/tmux-continuum'       # Auto-save sessions
set -g @plugin 'fcsonline/tmux-thumbs'             # Quick text copy
set -g @plugin 'sainnhe/tmux-fzf'                  # Fuzzy finder for tmux
set -g @plugin 'wfxr/tmux-fzf-url'                # Extract/open URLs from panes
set -g @plugin 'omerxx/tmux-sessionx'              # Fuzzy session switcher
set -g @plugin 'omerxx/tmux-floax'                 # Floating terminal pane

# Session persistence
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'

# tmux-sessionx settings
set -g @sessionx-bind 'o'
set -g @sessionx-auto-accept 'off'
set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-filter-current 'false'

# tmux-floax settings (Prefix + p for floating pane)
set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# tmux-fzf-url settings
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
